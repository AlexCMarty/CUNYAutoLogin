name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard — release workflow must not build e2e artifacts
        run: |
          set -euo pipefail
          # Assembled at runtime so this file does not contain the forbidden substrings
          # (a self-match would make grep -R on .github/workflows fail the job).
          e2e_build=$(printf '%s:%s' build e2e)
          e2e_var=$(printf '%s=%s' E2E_MANIFEST 1)
          if grep -RInE "(^|\\s)npm run ${e2e_build}(\\s|$)|${e2e_var}" .github/workflows; then
            echo "ERROR: Store release workflows must not invoke ${e2e_build} or ${e2e_var}."
            exit 1
          fi
          if grep -F 'http://127.0.0.1:4173' src/manifest.json; then
            echo "ERROR: Production manifest must not include the Playwright HTTP fixture host."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Zip extension (dist contents)
        run: cd dist && zip -r "../CUNYAutoLogin-${{ github.ref_name }}.zip" .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: CUNYAutoLogin-${{ github.ref_name }}.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
