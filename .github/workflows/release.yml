name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Guard — release workflow must not build e2e artifacts
        run: |
          set -euo pipefail
          # Assembled at runtime so this file does not contain the forbidden substrings
          # (a self-match would make grep -R on .github/workflows fail the job).
          e2e_build=$(printf '%s:%s' build e2e)
          e2e_var=$(printf '%s=%s' E2E_MANIFEST 1)
          if grep -RInE "(^|\\s)npm run ${e2e_build}(\\s|$)|${e2e_var}" .github/workflows; then
            echo "ERROR: Store release workflows must not invoke ${e2e_build} or ${e2e_var}."
            exit 1
          fi
          if grep -F 'http://127.0.0.1:4173' src/manifest.json; then
            echo "ERROR: Production manifest must not include the Playwright HTTP fixture host."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright system deps
        run: npx playwright install-deps chromium

      - name: Unit tests
        run: npm run test:unit

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Build
        run: npm run build

      - name: Zip extension (dist contents)
        run: cd dist && zip -r "../CUNYAutoLogin-${{ github.ref_name }}.zip" .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: CUNYAutoLogin-${{ github.ref_name }}.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
