title: CUNYAutoLogin
description: Stop manually logging into CUNY. We do that for you. An encrypted, on-device browser extension that fills your CUNY email, password, and 2FA code automatically.
url: https://cunyautologin.alexmarty.dev
baseurl: ""

# Social share card (Open Graph + Twitter), consumed by jekyll-seo-tag.
# Source: assets/img/og-card.svg — re-rasterize to og-card.png after edits.
# jekyll-seo-tag reads `image` from page front matter, so inject it site-wide
# through Jekyll defaults rather than a bare top-level `image:` key (ignored).
defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/img/og-card.png
        width: 1200
        height: 630

# /install/, /faq/, /privacy/ — not /install.html (GitHub Pages + jekyll serve)
permalink: pretty

theme: just-the-docs
color_scheme: cunyautologin

# Repository
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/AlexCMarty/CUNYAutoLogin"
gh_edit_branch: "main"
gh_edit_view_mode: "tree"

# Built-in search
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 3
  preview_words_after: 3

# Footer
back_to_top: true
back_to_top_text: "Back to top"

footer_content: >-
  Independent open-source project, not affiliated with or endorsed by CUNY.
  Code under the <a href="https://github.com/AlexCMarty/CUNYAutoLogin/blob/main/LICENSE">MIT License</a>.
  Icon derived from <a href="https://commons.wikimedia.org/wiki/File:Hutkachel.svg">Hutkachel</a> (© Mabit1, CC BY-SA 4.0).

# Aux nav links (top-right)
aux_links:
  "GitHub":
    - "https://github.com/AlexCMarty/CUNYAutoLogin"
aux_links_new_tab: true

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude project files that aren't part of the site
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - Dockerfile
  - docker-compose.yml
