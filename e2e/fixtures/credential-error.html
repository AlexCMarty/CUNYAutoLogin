<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>E2E credential error fixture</title>
  </head>
  <body>
    <!--
      Plan-05: simulates the `/oam/server/auth_cred_submit` page Oracle serves
      when username/password submission is rejected. The content script
      detects this URL and triggers the wrong-credential routing without any
      refill attempt, even if credentials are staged.
    -->
    <div id="serverError" role="alert">Incorrect Username or Password</div>
    <p>Oracle's rejection page.</p>
  </body>
</html>
