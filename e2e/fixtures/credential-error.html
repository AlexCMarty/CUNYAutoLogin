<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>E2E credential error fixture</title>
  </head>
  <body>
    <!--
      Simulates Oracle `/oam/server/auth_cred_submit` when username/password are rejected.
      The content script detects this URL and triggers wrong-credential routing without
      refill attempts, even if credentials are staged.
    -->
    <div id="serverError" role="alert">Incorrect Username or Password</div>
    <p>Oracle's rejection page.</p>
  </body>
</html>
