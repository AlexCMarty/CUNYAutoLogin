<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>E2E credential fixture</title>
  </head>
  <body>
    <!--
      Query params steer behavior so multiple specs share one fixture:
        (no param)     → clicking submit just flips __e2eCredentialSubmitted
                         (the pre-plan-05 default — used by unlocked-vault
                         autofill specs that assert the inputs still carry
                         the filled values).
        ?advance=1     → clicking submit navigates to /oaa-totp-factor/ so
                         the plan-05 Screen 4 → Allow Gate test can observe
                         the content script's "credentials accepted" signal.
        ?wrong=1       → clicking submit inserts the #serverError alert
                         WITHOUT navigating (inline Oracle re-render path).
        ?wrong=redirect → clicking submit navigates to
                         /oam/server/auth_cred_submit so the content script
                         can test the URL-based detection path.
    -->
    <input id="CUNYLoginUsernameDisplay" type="text" autocomplete="username" />
    <input id="CUNYLoginPassword" type="password" autocomplete="current-password" />
    <button id="submit" type="button">Log In</button>
    <script>
      window.__e2eCredentialSubmitted = false;
      window.__e2eCredentialSubmitCount = 0;
      const params = new URLSearchParams(window.location.search);
      const wrong = params.get("wrong");
      const advance = params.get("advance");
      document.getElementById("submit").addEventListener("click", function () {
        window.__e2eCredentialSubmitted = true;
        window.__e2eCredentialSubmitCount += 1;
        if (wrong === "1") {
          // Oracle's inline re-render: same URL, same form, plus the
          // #serverError alert element with the canonical text marker.
          if (!document.getElementById("serverError")) {
            const alert = document.createElement("div");
            alert.id = "serverError";
            alert.setAttribute("role", "alert");
            alert.textContent = "Incorrect Username or Password";
            document.body.insertBefore(alert, document.body.firstChild);
          }
          return;
        }
        if (wrong === "redirect") {
          window.location.href = "/oam/server/auth_cred_submit";
          return;
        }
        if (advance === "1") {
          window.location.href = "/oaa-totp-factor/";
        }
      });
    </script>
  </body>
</html>
