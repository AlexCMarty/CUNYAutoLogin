<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>E2E TOTP fixture</title>
  </head>
  <body>
    <input id="otpValue|input" type="text" inputmode="numeric" maxlength="6" />
    <button id="verifyBtn" type="button"><span>Verify</span></button>
    <script>
      window.__e2eTotpVerified = false;
      document.getElementById("verifyBtn").addEventListener("click", function () {
        window.__e2eTotpVerified = true;
        // Optional: redirect to ?next= URL after verification (used by plan-06+ fixture chains).
        const next = new URLSearchParams(window.location.search).get("next");
        if (next) window.location.href = next;
      });
    </script>
  </body>
</html>
